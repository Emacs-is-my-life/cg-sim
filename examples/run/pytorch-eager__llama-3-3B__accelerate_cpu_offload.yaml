logger:
  args:
    result_path: "output/pytorch-eager__llama-3-3B__accelerate_cpu_offload/sim_results/result.json"
    log_level: 1
trace:
  type: "PytorchProfile"
  args:
    bundle_manifest: "../trace/llama3b_offload_model/llama_bundle/manifest.json"
    skip_zero_byte_tensors: true
    zero_wait_nodes: true
    add_temporal_data_control_edges: true
    cpu_node_probe_effect_compensate: true
hardware:
  compute:
    - name: "cpu"
      type: "SimpleCPU"
      args:
        memory: "ram"
        modifier: 1
    - name: "gpu0"
      type: "SimpleGPU"
      args:
        memory: "vram0"
        modifier: 1
        max_concurrent_jobs: 1
  memory:
    - name: "ram"
      type: "SimpleRAM"
      args:
        custom_dep_tag: "TARGET_RAM"
        memory_size_KB: 33554432
        # 14 GB/s: measured pageable-with-driver-staged-bounce HtoD
        # bandwidth from this offload trace's H2D events (mean
        # 14.17 GB/s on 3B, 14.91 GB/s on 8B across all transfers
        # >=10 MB; per docs/offload-schemes/accelerate_cpu-offload_buffers-false.md:239-246).
        # cg-sim has a single bandwidth knob, but accelerate cpu_offload
        # is unimodal in real life — every H2D goes through the same
        # pageable bounce-buffer path — so a single tuned value is
        # faithful here (unlike diffusers_group_offload's bimodal case).
        memory_bandwidth_KBps: 14000000
    - name: "vram0"
      type: "SimpleVRAM"
      args:
        custom_dep_tag: "TARGET_VRAM"
        memory_size_KB: 24624320
        memory_bandwidth_KBps: 14000000
  storage:
    - name: "ssd"
      type: "SimpleSSD"
      args:
        custom_dep_tag: "TARGET_SSD"
        fixed_latency_micros: 50
        read_io_curve_KBps:
          - [4, 80000]
          - [8, 160000]
          - [16, 320000]
          - [32, 800000]
          - [64, 1600000]
          - [128, 3000000]
          - [256, 5000000]
          - [512, 6500000]
          - [1024, 7000000]
        write_io_curve_KBps:
          - [4, 60000]
          - [8, 120000]
          - [16, 250000]
          - [32, 600000]
          - [64, 1200000]
          - [128, 2200000]
          - [256, 3500000]
          - [512, 4500000]
          - [1024, 5000000]
scheduler:
  type: "AccelerateCpuOffload"
  args:
    cpu_compute: "cpu"
    cuda_compute: "gpu0"
    cuda_device: "cuda:0"
    h2d_streams: 1
    # The offload trace's per-leaf pre/post_forward hooks generate
    # many alias-style ops (aten::to, detach_, set_module_tensor_to_device),
    # which makes the loader's _mark_implicit_inputs heuristic
    # retype too many transient activations to INPUT and overrun
    # VRAM at layout. Restrict the layout-time pre-claim to actual
    # model parameters (WEIGHT + LEAF only); transient INPUT tids
    # get claimed lazily by _ensure_outputs_claimed at runtime.
    initial_tensor_types: ["WEIGHT", "LEAF"]
