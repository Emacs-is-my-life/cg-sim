logger:
  args:
    result_path: "output/pytorch-eager__llama-3-3B__accelerate_cpu_offload/sim_results/result.json"
    log_level: 1
trace:
  type: "PytorchProfile"
  args:
    bundle_manifest: "../trace/pytorch-eager__llama-3-3B__RTX4090/llama_bundle/manifest.json"
    skip_zero_byte_tensors: true
    zero_wait_nodes: true
    add_temporal_data_control_edges: true
    cpu_node_probe_effect_compensate: true
hardware:
  compute:
    - name: "cpu"
      type: "SimpleCPU"
      args:
        memory: "ram"
        modifier: 1
    - name: "gpu0"
      type: "SimpleGPU"
      args:
        memory: "vram0"
        modifier: 1
        max_concurrent_jobs: 1
  memory:
    - name: "ram"
      type: "SimpleRAM"
      args:
        custom_dep_tag: "TARGET_RAM"
        memory_size_KB: 33554432
        # 14 GB/s: per-transfer DMA bandwidth measured directly from
        # the accelerate cpu_offload reference traces — computed as
        # `module_size_bytes / Memcpy_event_duration_ns` over every
        # Memcpy HtoD event in the trace (2130 transfers >=10 MB on
        # 3B, 2430 on 8B). Doc lines 230-294 of
        # docs/offload-schemes/accelerate_cpu-offload_buffers-false.md:
        #
        #   | mean | std  | p1  | p50  | p99  | mode      |
        #   |------|------|-----|------|------|-----------|
        #   | 14.17| 1.49 | 9.4 | 14.8 | 16.6 | 15.0-15.5 | (3B, GB/s)
        #   | 14.91| 0.79 | 11.6| 15.1 | 15.8 | (similar) | (8B, GB/s)
        #
        # Unimodal distribution (positive excess kurtosis +1.33/+9.10
        # rules out the bimodal "pinned/pageable" mixture). Every H2D
        # goes through a single "pageable-source with driver-staged
        # pinned bounce buffer" path — well above true-pageable
        # (5-10 GB/s) but well below true-pinned (22-24 GB/s on PCIe
        # 4.0 x16). Single tuned bandwidth is faithful for this
        # workload (unlike diffusers_group_offload's bimodal case).
        memory_bandwidth_KBps: 14000000
    - name: "vram0"
      type: "SimpleVRAM"
      args:
        custom_dep_tag: "TARGET_VRAM"
        memory_size_KB: 24624320
        memory_bandwidth_KBps: 14000000
  storage:
    - name: "ssd"
      type: "SimpleSSD"
      args:
        custom_dep_tag: "TARGET_SSD"
        fixed_latency_micros: 50
        read_io_curve_KBps:
          - [4, 80000]
          - [8, 160000]
          - [16, 320000]
          - [32, 800000]
          - [64, 1600000]
          - [128, 3000000]
          - [256, 5000000]
          - [512, 6500000]
          - [1024, 7000000]
        write_io_curve_KBps:
          - [4, 60000]
          - [8, 120000]
          - [16, 250000]
          - [32, 600000]
          - [64, 1200000]
          - [128, 2200000]
          - [256, 3500000]
          - [512, 4500000]
          - [1024, 5000000]
scheduler:
  type: "AccelerateCpuOffload"
  args:
    cpu_compute: "cpu"
    cuda_compute: "gpu0"
    cuda_device: "cuda:0"
    h2d_streams: 1
