logger:
  args:
    result_path: "output/accelerate-cpu-offload__llama-3-3B__accelerate/sim_results/result.json"
    log_level: 1
trace:
  type: "PytorchOffloadLoader"
  args:
    bundle_manifest: "../trace/accelerate-cpu-offload__llama-3-3B__RTX4090/llama_bundle/manifest.json"
    skip_zero_byte_tensors: true
    zero_wait_nodes: true
    add_temporal_data_control_edges: true
    cpu_node_probe_effect_compensate: true
    offload_reconstruct: true
hardware:
  compute:
    - name: "cpu"
      type: "SimpleCPU"
      args:
        memory: "ram"
        modifier: 1
    - name: "gpu0"
      type: "SimpleGPU"
      args:
        memory: "vram0"
        modifier: 1
        max_concurrent_jobs: 1
  memory:
    - name: "ram"
      type: "SimpleRAM"
      args:
        custom_dep_tag: "TARGET_RAM"
        memory_size_KB: 33554432
        # MEASURED pageable H2D rate from the trace: 108.20 GB of weight
        # streaming over 3826 Memcpy HtoD events took 7.759 s => 13.95 GB/s
        # aggregate (per-transfer median 14.3 GB/s; pageable, ~2x slower than
        # pinned ~25 GB/s). The loader neutralises the recorded Memcpy nodes and
        # the scheduler re-models H2D as RAM->VRAM TransferJobs; this is the
        # bandwidth they water-fill against (wall = bytes / rate), NOT the
        # recorded duration replayed. (Replaces the earlier 8.32 GB/s value,
        # which was an under-volume fudge -- see docs/known_problems.md P4.)
        memory_bandwidth_KBps: 13946000
    - name: "vram0"
      type: "SimpleVRAM"
      args:
        custom_dep_tag: "TARGET_VRAM"
        memory_size_KB: 24624320
        # Same 13.95 GB/s effective H2D rate as ram (the RAM->VRAM transfer
        # water-fills the bottleneck link); see ram note above.
        memory_bandwidth_KBps: 13946000
  storage:
    - name: "ssd"
      type: "SimpleSSD"
      args:
        custom_dep_tag: "TARGET_SSD"
        fixed_latency_micros: 50
        read_io_curve_KBps:
          - [4, 80000]
          - [8, 160000]
          - [16, 320000]
          - [32, 800000]
          - [64, 1600000]
          - [128, 3000000]
          - [256, 5000000]
          - [512, 6500000]
          - [1024, 7000000]
        write_io_curve_KBps:
          - [4, 60000]
          - [8, 120000]
          - [16, 250000]
          - [32, 600000]
          - [64, 1200000]
          - [128, 2200000]
          - [256, 3500000]
          - [512, 4500000]
          - [1024, 5000000]
scheduler:
  type: "AccelerateCPUOffload"
  args:
    cpu_compute: "cpu"
    cuda_compute: "gpu0"
    cuda_device: "cuda:0"
    h2d_streams: 1
