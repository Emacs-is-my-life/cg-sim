logger:
  args:
    result_path: "output/diffusers-group-offload__sd3__diffusers/sim_results/result.json"
    log_level: 1
trace:
  type: "PytorchOffloadLoader"
  args:
    bundle_manifest: "../trace/diffusers-group-offload__sd3__RTX4090/llama_bundle/manifest.json"
    skip_zero_byte_tensors: true
    zero_wait_nodes: true
    add_temporal_data_control_edges: true
    cpu_node_probe_effect_compensate: true   # no probe_effect_table.csv for diffusers -> no-op (CPU stays profiled)
    offload_reconstruct: true
    offload_variant: "auto"   # auto-detects "diffusers" (async cudaMemcpyAsync, ratio<<1 -> keep it)
hardware:
  compute:
    - name: "cpu"
      type: "SimpleCPU"
      args:
        memory: "ram"
        modifier: 1
    - name: "gpu0"
      type: "SimpleGPU"
      args:
        memory: "vram0"
        modifier: 1
        max_concurrent_jobs: 1
  memory:
    - name: "ram"
      type: "SimpleRAM"
      args:
        custom_dep_tag: "TARGET_RAM"
        memory_size_KB: 33554432
        # MEASURED pinned H2D rate from the SDXL trace: 121.10 GB streamed over
        # 20050 Memcpy HtoD (Pinned->Device) events took 4558 ms => 26.57 GB/s
        # aggregate. diffusers low_cpu_mem_usage=False pins the cpu masters, so H2D
        # is ~2x the accelerate pageable rate (13.95). The loader neutralises the
        # recorded Memcpy nodes; the scheduler re-models H2D as RAM->VRAM
        # TransferJobs water-filled against this rate (wall = bytes/rate), NOT the
        # recorded duration replayed.
        memory_bandwidth_KBps: 26570000
    - name: "vram0"
      type: "SimpleVRAM"
      args:
        custom_dep_tag: "TARGET_VRAM"
        memory_size_KB: 24624320
        # Same 26.57 GB/s effective pinned H2D rate (RAM->VRAM transfer water-fills
        # the bottleneck link); see ram note above.
        memory_bandwidth_KBps: 26570000
  storage:
    - name: "ssd"
      type: "SimpleSSD"
      args:
        custom_dep_tag: "TARGET_SSD"
        fixed_latency_micros: 50
        read_io_curve_KBps:
          - [4, 80000]
          - [8, 160000]
          - [16, 320000]
          - [32, 800000]
          - [64, 1600000]
          - [128, 3000000]
          - [256, 5000000]
          - [512, 6500000]
          - [1024, 7000000]
        write_io_curve_KBps:
          - [4, 60000]
          - [8, 120000]
          - [16, 250000]
          - [32, 600000]
          - [64, 1200000]
          - [128, 2200000]
          - [256, 3500000]
          - [512, 4500000]
          - [1024, 5000000]
scheduler:
  type: "DiffusersGroupOffload"
  args:
    cpu_compute: "cpu"
    cuda_compute: "gpu0"
    cuda_device: "cuda:0"
